<style>

  .filters{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin:28px 0 0;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
  .fgrid{display:flex;flex-wrap:wrap;gap:16px}
  .fld{display:flex;flex-direction:column;gap:6px;min-width:140px}

  .stats{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:16px 0 0;flex-wrap:wrap;gap:8px}
  .reset{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--sans);padding:0}

  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:8px;padding:20px 22px;transition:all .2s}
  .card:hover{border-left-color:var(--cyan);background:rgba(255,255,255,.055)}

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
(function(){
  var state={kind:"",domain:"",indicator:"",year:"",q:""};
  function el(s){return document.querySelector(s);}
  fetch("archive.json").then(function(r){return r.json();}).then(function(data){
    var issues=data.issues||[];
    var doms={},inds={},years={};
    issues.forEach(function(i){
      (i.domains||[]).forEach(function(d){doms[d]=1;});
      (i.indicators||[]).forEach(function(x){inds[x]=1;});
      if(i.date) years[i.date.slice(0,4)]=1;
    });
    function opts(sel,obj,all){
      var s=el(sel); Object.keys(obj).sort().forEach(function(k){
        var o=document.createElement("option"); o.value=k; o.textContent=k; s.appendChild(o);});
    }
    opts("#f-domain",doms);opts("#f-indicator",inds);
    opts("#f-year",years);

    function render(){
      var list=issues.filter(function(i){
        if(state.kind&&i.kind!==state.kind)return false;
        if(state.domain&&(i.domains||[]).indexOf(state.domain)<0)return false;
        if(state.indicator&&(i.indicators||[]).indexOf(state.indicator)<0)return false;
        if(state.year&&(i.date||"").indexOf(state.year)!==0)return false;
        if(state.q){var h=(i.id+" "+i.title+" "+(i.domains||[]).join(" ")+" "+(i.indicators||[]).join(" ")).toLowerCase();
          if(h.indexOf(state.q.toLowerCase())<0)return false;}
        return true;
      });
      el("#stat").textContent="共 "+list.length+" 期";
      var box=el("#list");
      if(!list.length){box.innerHTML='<div class="empty">没有符合条件的条目。<br>试试放宽筛选条件。</div>';return;}
      box.innerHTML=list.map(function(i){
        var chips=(i.domains||[]).map(function(d){return '<span class="chip">'+d+'</span>';}).join("");
        var inds2=(i.indicators||[]).map(function(x){return '<span class="chip ind">'+x+'</span>';}).join("");
        var kindTag=i.kind==="deep"?'<span class="chip deep">深度研究</span>':"";
        return '<article class="card"><div class="crow"><span class="jid">'+(i.id||"")+'</span><span class="cdate">'+(i.date||"")+'</span></div>'
          +'<h2 class="ctitle"><a href="../'+(i.url||"#").replace(/^zh\//,"")+'">'+i.title+'</a></h2>'
          +'<div class="chips">'+kindTag+chips+'</div><div class="chips">'+inds2+'</div></article>';
      }).join("");
    }
    ["#f-kind","#f-domain","#f-indicator","#f-year"].forEach(function(s){
      el(s).addEventListener("change",function(e){
        state[s.replace("#f-","")]=e.target.value;render();});
    });
    el("#f-q").addEventListener("input",function(e){state.q=e.target.value;render();});
    el("#reset").addEventListener("click",function(){
      state={kind:"",domain:"",indicator:"",year:"",q:""};
      ["#f-kind","#f-domain","#f-indicator","#f-year","#f-q"].forEach(function(s){el(s).value="";});
      render();});
    render();
  }).catch(function(e){
    el("#list").innerHTML='<div class="empty">归档数据载入失败，请稍后重试。</div>';
  });
})();
</script>

/* ICS: 反邮箱混淆兜底（Cloudflare Scrape Shield 不可关闭时的还原脚本） */
(function(){
  function decode(h){
    try{
      var r='',k=parseInt(h.substr(0,2),16);
      for(var i=2;i<h.length;i+=2){ r+=String.fromCharCode(parseInt(h.substr(i,2),16)^k); }
      return r;
    }catch(e){ return ''; }
  }
  function fix(){
    var els=document.querySelectorAll('[data-cfemail]');
    for(var i=0;i<els.length;i++){
      var el=els[i], email=decode(el.getAttribute('data-cfemail'));
      if(!email) continue;
      el.textContent=email;
      el.removeAttribute('data-cfemail');
      el.classList.remove('__cf_email__');
      var a=el.closest('a');
      if(a && (a.getAttribute('href')||'').indexOf('/cdn-cgi/l/email-protection')===0){
        a.setAttribute('href','mailto:'+email);
      }
    }
    var html=document.body?document.body.innerHTML:'';
    if(html.indexOf('[email\u00a0protected]')!==-1){
      document.body.innerHTML=html.split('[email\u00a0protected]').join('members@ics-studies.org');
    }
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',fix); }
  else { fix(); }
  window.addEventListener('load',function(){ setTimeout(fix,300); setTimeout(fix,1200); });
})();
