<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究归档 | 星际文明研究所</title>
    <meta name="description" content="ICS关于技术、治理和文明发展的学术研究存档">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-deep-space: #0a1628;
            --color-quantum-purple: #7c3aed;
            --color-quantum-purple-light: #a78bfa;
            --color-nebula-cyan: #06b6d4;
            --color-nebula-cyan-light: #22d3ee;
            --color-energy-gold: #f59e0b;
            --color-text-primary: #ffffff;
            --color-text-secondary: rgba(255, 255, 255, 0.8);
            --font-zh-sans: 'Noto Sans SC', sans-serif;
            --font-en-display: 'Orbitron', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 14px !important;
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-zh-sans);
            font-weight: 300;
            background: var(--color-deep-space);
            color: var(--color-text-secondary);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(167, 139, 250, 0.1);
        }
        
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }
        
        .nav-logo {
            width: 40px;
            height: 40px;
        }
        
        .nav-title {
            font-family: var(--font-en-display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-text-primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-link {
            font-family: var(--font-zh-sans);
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--color-quantum-purple-light);
        }
        
        .page-hero {
            position: relative;
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
            overflow: hidden;
        }
        
        .page-hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }
        
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
            animation: float 20s ease-in-out infinite;
        }
        
        .nebula-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--color-quantum-purple), transparent);
            top: -100px;
            left: -100px;
        }
        
        .nebula-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--color-nebula-cyan), transparent);
            bottom: -50px;
            right: -50px;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }
        
        .page-hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
        }
        
        .page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 3.0rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            background: linear-gradient(135deg, #ffffff 0%, var(--color-quantum-purple-light) 50%, var(--color-nebula-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        
        .main-content {
            flex: 1;
            padding: 4rem 2rem;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .archive-intro {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }
        
        .archive-intro p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.9;
        }
        
        .research-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .research-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        
        .research-card:hover {
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.2);
            transform: translateY(-4px);
        }
        
        .research-week {
            font-family: var(--font-zh-sans);
            font-size: 0.9rem;
            color: var(--color-nebula-cyan);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .research-title {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--color-text-primary);
            margin-bottom: 0.75rem;
            line-height: 1.6;
            flex-grow: 1;
        }
        
        .research-meta {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1rem;
        }
        
        .research-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(167, 139, 250, 0.15);
            color: var(--color-quantum-purple-light);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.875rem;
            transition: all 0.3s;
            align-self: flex-start;
        }
        
        .research-link:hover {
            background: rgba(167, 139, 250, 0.25);
            transform: translateX(4px);
        }
        
        .footer {
            background: rgba(10, 22, 40, 0.95);
            border-top: 1px solid rgba(167, 139, 250, 0.1);
            padding: 2rem;
            margin-top: auto;
        }
        
        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        
        .footer-copyright {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.4);
        }
        
        @media (max-width: 768px) {
            .page-title {
                font-size: 1.75rem;
            }
            
            .research-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>

                    <circle cx="22" cy="22" r="13" stroke="rgba(6,182,212,0.2)" stroke-width="1" fill="none" />
                    <circle cx="22" cy="22" r="5" fill="rgba(167,139,250,0.9)" />
                </svg>
                <span class="nav-title">ICS</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-link">首页</a></li>
                <li><a href="深度研究.html" class="nav-link">本周</a></li>
                <li><a href="研究归档.html" class="nav-link active">归档</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-hero">
        <div class="page-hero-bg">

            <div class="nebula nebula-2"></div>
        </div>
        <div class="page-hero-content">
            <h1 class="page-title">研究归档</h1>
        </div>

    <main class="main-content">
        <div class="container">
            <div class="archive-intro">
                <p>🔬 浏览星际文明研究所关于技术、治理和文明发展的学术研究。每一份出版物都代表从星际文明视角进行的严谨分析。</p>
            </div>

            <div class="research-grid" id="researchGrid">

                <!-- 2025年1月 -->

                    <a href="daily-commentary-archive/gpt5-20250115.html" class="research-link">阅读全文 →</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-copyright">© 2025 星际文明研究所。保留所有权利。</p>
        </div>
    </footer>

</body>

</html>
