<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICS 管理后台登录</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0a1628; color: #fff; }
        .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card { width: 100%; max-width: 420px; background: rgba(255,255,255,.06); border: 1px solid rgba(167,139,250,.35); border-radius: 14px; padding: 24px; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 18px; color: rgba(255,255,255,.75); font-size: 14px; }
        label { display:block; margin: 10px 0 6px; font-size: 13px; color: rgba(255,255,255,.8); }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(167,139,250,.4); background: rgba(255,255,255,.08); color: #fff; }
        button { width: 100%; margin-top: 14px; padding: 10px 12px; border: 0; border-radius: 8px; background: linear-gradient(135deg,#7c3aed,#06b6d4); color: #fff; font-weight: 600; cursor: pointer; }
        .hint { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.65); }
        .error { margin-top: 10px; font-size: 13px; color: #fca5a5; display: none; }
        a { color: #a78bfa; }
    </style>
</head>
<body>
<div class="wrap">
    <form class="card" id="loginForm">
        <h1>ICS 内容管理后台</h1>
        <p>根本性改进MVP：认证 + CMS（本地可运行）</p>

        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" required value="admin@ics-studies.org" />

        <label for="password">密码</label>
        <input id="password" name="password" type="password" required value="ICS2026!" />

        <button type="submit">登录后台</button>
        <div id="error" class="error">账号或密码错误</div>
        <div class="hint">MVP演示账号已预填。生产环境请迁移到服务端鉴权（Auth0/Firebase/自建）。</div>
        <div class="hint"><a href="/zh/深度研究.html">返回站点</a></div>
    </form>
</div>

<script src="/js/cms-auth.js"></script>
<script>
    const session = window.ICSAuth.getSession();
    if (session) {
        window.location.href = '/admin/cms.html';
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = e.target.email.value.trim();
        const password = e.target.password.value;
        const ok = window.ICSAuth.login(email, password);
        if (!ok) {
            document.getElementById('error').style.display = 'block';
            return;
        }
        window.location.href = '/admin/cms.html';
    });
</script>
</body>
</html>
