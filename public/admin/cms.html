<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICS CMS 管理台</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0a1628; color: #fff; }
        .top { padding: 14px 20px; border-bottom: 1px solid rgba(167,139,250,.25); display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .top .muted { color: rgba(255,255,255,.7); font-size: 13px; }
        .container { padding: 18px; display:grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
        .card { background: rgba(255,255,255,.05); border: 1px solid rgba(167,139,250,.25); border-radius: 12px; padding: 14px; }
        h2 { margin: 0 0 12px; font-size: 18px; }
        .actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 10px; }
        button, .mini, input[type=file] { border-radius: 8px; border: 1px solid rgba(167,139,250,.35); background: rgba(255,255,255,.08); color: #fff; padding: 8px 10px; cursor: pointer; text-decoration:none; font-size: 13px; }
        button.primary { background: linear-gradient(135deg,#7c3aed,#06b6d4); border: 0; }
        button.danger, .mini.danger { border-color:#ef4444; color:#fecaca; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid rgba(167,139,250,.15); vertical-align: top; }
        .mini { display:inline-block; margin-right:6px; }
        label { display:block; margin: 8px 0 6px; font-size: 13px; color: rgba(255,255,255,.8); }
        input, textarea, select { width:100%; box-sizing:border-box; border-radius:8px; border:1px solid rgba(167,139,250,.35); background: rgba(255,255,255,.08); color:#fff; padding: 9px 10px; }
        textarea { min-height: 100px; resize: vertical; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        @media (max-width: 980px) { .container { grid-template-columns: 1fr; } }
    </style>
    <!-- ICS-SEO-START -->
    <link rel="canonical" href="https://ics-studies.org/dmin/cms.html">
    <link rel="alternate" hreflang="en" href="https://ics-studies.org/dmin/cms.html">
    <link rel="alternate" hreflang="zh" href="https://ics-studies.org/dmin/cms.html">
    <link rel="alternate" hreflang="x-default" href="https://ics-studies.org/dmin/cms.html">
    <meta name="description" content="">

    <meta property="og:type" content="article">

    <meta property="og:title" content="ICS CMS 管理台">

    <meta property="og:description" content="">

    <meta property="og:url" content="https://ics-studies.org/dmin/cms.html">
    <meta property="og:site_name" content="Interstellar Civilization Studies">

    <meta property="og:locale" content="en">

    <meta property="og:locale:alternate" content="zh">
    <meta property="og:image" content="https://ics-studies.org/images/og-default.jpg">

    <meta property="og:image:width" content="1200">

    <meta property="og:image:height" content="630">

    <meta property="og:image:type" content="image/jpeg">

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="ICS CMS 管理台">

    <meta name="twitter:description" content="">

    <meta name="twitter:image" content="https://ics-studies.org/images/og-default.jpg">

    <script type="application/ld+json">

    {

      "@context": "https://schema.org",

      "@type": "ScholarlyArticle",

      "headline": "ICS CMS 管理台",

      "datePublished": "",

      "author": {"@type": "Organization", "name": "ICS Research Institute"},

      "publisher": {"@type": "Organization", "name": "Interstellar Civilization Studies"},

      "description": "",

      "mainEntityOfPage": {

        "@type": "WebPage",

        "@id": "https://ics-studies.org/dmin/cms.html"

      }

    }

    </script>

    <!-- ICS-SEO-END -->
</head>
<body>
    <div class="top">
        <div>
            <strong>ICS CMS 管理台（MVP）</strong>
            <div class="muted">已登录：<span id="adminUser"></span></div>
        </div>
        <div class="actions">
            <a class="mini" href="/zh/深度研究.html" target="_blank" rel="noopener">查看站点</a>
            <button id="logoutBtn" class="danger" type="button">退出登录</button>
        </div>
    </div>

    <div class="container">
        <!-- 统计面板 -->
        <section class="card" style="grid-column: 1 / -1;">
            <h2>📊 网站统计</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 10px;">
                <div style="background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3); border-radius: 8px; padding: 12px;">
                    <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">文章总数</div>
                    <div style="font-size: 24px; font-weight: 600;" id="statTotalArticles">-</div>
                </div>
                <div style="background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); border-radius: 8px; padding: 12px;">
                    <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">已发布</div>
                    <div style="font-size: 24px; font-weight: 600;" id="statPublished">-</div>
                </div>
                <div style="background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); border-radius: 8px; padding: 12px;">
                    <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">邮件订阅数</div>
                    <div style="font-size: 24px; font-weight: 600;" id="statSubscribers">-</div>
                </div>
                <div style="background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); border-radius: 8px; padding: 12px;">
                    <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">有帮助反馈</div>
                    <div style="font-size: 24px; font-weight: 600;" id="statHelpful">-</div>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>内容列表</h2>
            <div class="actions">
                <button id="newBtn" type="button">新建</button>
                <button id="exportBtn" type="button">导出JSON</button>
                <button id="exportIndexBtn" type="button">导出搜索索引(content-index.json)</button>
                <label class="mini" for="importFile">导入JSON</label>
                <input id="importFile" type="file" accept="application/json" />
            </div>
            <div class="muted" style="margin: 6px 0 10px;">
                说明：导出搜索索引后，将文件覆盖到 public/data/content-index.json，即可一键同步站内搜索数据。
            </div>
            <table>
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>语言</th>
                        <th>分类</th>
                        <th>状态</th>
                        <th>更新时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="articleTableBody"></tbody>
            </table>
        </section>

        <section class="card">
            <h2 id="formTitle">新建文章</h2>
            <form id="articleForm" data-edit-id="">
                <label>标题</label>
                <input name="title" required />

                <div class="grid2">
                    <div>
                        <label>Slug（不含.html）</label>
                        <input name="slug" required />
                    </div>
                    <div>
                        <label>语言</label>
                        <select name="lang">
                            <option value="zh">zh</option>
                            <option value="en">en</option>
                        </select>
                    </div>
                </div>

                <div class="grid2">
                    <div>
                        <label>分类</label>
                        <input name="category" required />
                    </div>
                    <div>
                        <label>状态</label>
                        <select name="status">
                            <option value="draft">draft</option>
                            <option value="published">published</option>
                            <option value="archived">archived</option>
                        </select>
                    </div>
                </div>

                <label>标签（逗号分隔）</label>
                <input name="tags" />

                <label>摘要</label>
                <textarea name="summary"></textarea>

                <label>正文（MVP文本）</label>
                <textarea name="content"></textarea>

                <div class="actions">
                    <button class="primary" type="submit">保存</button>
                    <button type="button" onclick="document.getElementById('articleForm').reset()">清空</button>
                </div>
            </form>
        </section>
    </div>

<script src="/js/cms-auth.js"></script>
<script>
    if (!window.ICSAuth?.isEnabled?.()) {
        window.location.href = '/admin/login.html';
    }
</script>
<script src="/js/cms-admin.js"></script>
<script>
    window.ICSCMS.init();
</script>
</body>
</html>
