<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <circle cx="32" cy="32" r="20" stroke="rgba(167,139,250,0.2)" stroke-width="0.8" fill="none"/>
  <circle cx="32" cy="32" r="12" stroke="rgba(6,182,212,0.2)" stroke-width="0.8" fill="none"/>
  <circle cx="32" cy="32" r="5" fill="#a78bfa"/>
  <circle cx="32" cy="14" r="3" fill="#06b6d4">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="26" r="2" fill="#f59e0b" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="-360 32 32" dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- Compass needle -->
  <line x1="32" y1="22" x2="32" y2="8" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <polygon points="32,6 30,12 34,12" fill="#a78bfa" opacity="0.7"/>
</svg>
