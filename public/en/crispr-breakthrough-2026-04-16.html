<script>
/* ICS: 反邮箱混淆兜底（Cloudflare Scrape Shield 不可关闭时的还原脚本） */
(function(){
  function decode(h){
    try{
      var r='',k=parseInt(h.substr(0,2),16);
      for(var i=2;i<h.length;i+=2){ r+=String.fromCharCode(parseInt(h.substr(i,2),16)^k); }
      return r;
    }catch(e){ return ''; }
  }
  function fix(){
    var els=document.querySelectorAll('[data-cfemail]');
    for(var i=0;i<els.length;i++){
      var el=els[i], email=decode(el.getAttribute('data-cfemail'));
      if(!email) continue;
      el.textContent=email;
      el.removeAttribute('data-cfemail');
      el.classList.remove('__cf_email__');
      var a=el.closest('a');
      if(a && (a.getAttribute('href')||'').indexOf('/cdn-cgi/l/email-protection')===0){
        a.setAttribute('href','mailto:'+email);
      }
    }
    var html=document.body?document.body.innerHTML:'';
    if(html.indexOf('[email\u00a0protected]')!==-1){
      document.body.innerHTML=html.split('[email\u00a0protected]').join('members@ics-studies.org');
    }
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',fix); }
  else { fix(); }
  window.addEventListener('load',function(){ setTimeout(fix,300); setTimeout(fix,1200); });
})();
</script>
