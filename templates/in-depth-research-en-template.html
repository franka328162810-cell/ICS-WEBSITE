    <script>
        // Scroll to search module
        function scrollToSearch() {
            const searchSection = document.querySelector('.search-section');
            if (searchSection) {

        // Share article
        function shareArticle() {
            if (navigator.share) {

                    url: window.location.href
                }).catch(err => console.log('Share failed', err));
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('Link copied to clipboard!');
                });
            }
        }

        function toggleCitation() {
            document.getElementById('citationBox').classList.toggle('active');
        }

        // Navbar scroll effect (added globally in template)
        const navbar = document.getElementById('navbar');
        if (navbar) {
            window.addEventListener('scroll', () => {

                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }

        // === Search module functionality ===
        const searchIndexEn = [
            { title: "In-Depth Research: Trump's Ban on Anthropic", category: 'AI Governance', date: '2026-03-04', url: 'in-depth-research.html', keywords: ['Anthropic', 'AI', 'ethics', 'Trump'] },
            { title: 'Daily Commentary', category: 'AI Governance', date: '2026-03-04', url: 'daily-commentary.html', keywords: ['commentary', 'policy', 'AI'] },
            { title: 'Space Governance', category: 'Space Governance', date: '2025-01-01', url: 'space-governance.html', keywords: ['space', 'governance', 'mars'] },
            { title: 'AI Governance', category: 'AI Governance', date: '2025-01-01', url: 'ai-governance.html', keywords: ['ai', 'governance', 'safety'] },
            { title: 'Dialogue with Environmental Ethics', category: 'Ethics', date: '2025-01-01', url: 'dialogue-with-environmental-ethics.html', keywords: ['ethics', 'environment', 'dialogue'] },
            { title: 'Forbidden Red Lines', category: 'Ethics', date: '2025-01-01', url: 'forbidden-red-lines.html', keywords: ['frl', 'red lines', 'risk'] },
            { title: 'Research Archive', category: 'AI Governance', date: '2025-01-01', url: 'research-archive.html', keywords: ['archive', 'research', 'history'] },
            { title: 'Resources', category: 'Ethics', date: '2025-01-01', url: 'resources.html', keywords: ['reading', 'resources', 'glossary'] }
        ];

        let runtimeSearchIndexEn = searchIndexEn;

        async function loadSearchIndexEn() {
            try {
                const res = await fetch('/data/content-index.json', { cache: 'no-cache' });
                if (!res.ok) return;
                const data = await res.json();
                if (!Array.isArray(data)) return;
                const enItems = data
                    .filter(item => item.lang === 'en')
                    .map(item => ({
                        title: item.title,
                        category: item.category,
                        date: item.date,
                        url: item.url,
                        keywords: Array.isArray(item.keywords) ? item.keywords : []
                    }));
                if (enItems.length > 0) runtimeSearchIndexEn = enItems;
            } catch (_) {
                // keep local fallback index
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>\"']/g, m => map[m]);
        }

        function renderSearchResults(results, query, filter) {
            const container = document.getElementById('searchResults');
            if (!container) return;

            if (results.length === 0) {
                container.innerHTML = `<div class="search-empty">No matching content found. Try: AI Governance, Ethics, Space Governance.</div>`;
                container.classList.add('active');
                return;
            }

            const header = `<div class="search-empty">${results.length} result(s) ${query ? `for "${escapeHtml(query)}"` : ''} ${filter !== 'all' ? `(category: ${escapeHtml(filter)})` : ''}</div>`;
            const items = results.slice(0, 8).map(item => `
                <a class="search-result-item" href="${item.url}">
                    <div class="search-result-title">${escapeHtml(item.title)}</div>
                    <div class="search-result-meta">${escapeHtml(item.category)} · ${escapeHtml(item.date)}</div>
                </a>
            `).join('');

            container.innerHTML = header + items;
            container.classList.add('active');
        }

        function performSearch() {
            const input = document.getElementById('searchInput');
            const query = (input?.value || '').trim().toLowerCase();
            const activeFilter = document.querySelector('.filter-button.active');
            const filter = activeFilter ? activeFilter.getAttribute('data-filter') : 'all';

            const results = runtimeSearchIndexEn.filter(item => {
                const passFilter = filter === 'all' || item.category === filter;
                if (!passFilter) return false;
                if (!query) return true;

                const haystack = `${item.title} ${item.category} ${item.keywords.join(' ')}`.toLowerCase();
                return haystack.includes(query);
            });

            renderSearchResults(results, query, filter);
        }

        function filterByCategory(button) {
            document.querySelectorAll('.filter-button').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            performSearch();
        }

        document.getElementById('searchInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        (function initSearchFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (!q) return;

            const input = document.getElementById('searchInput');
            if (!input) return;

            input.value = q;
            performSearch();
        })();

        loadSearchIndexEn();
    </script>
