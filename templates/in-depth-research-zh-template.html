        // 处理邮件订阅
        function handleNewsletterSignup(event) {
            event.preventDefault();
            const form = event.target;
            const email = form.querySelector('input[type="email"]').value;
            const name = form.querySelector('input[type="text"]').value || '访客';

            // 保存到localStorage
            let subscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');
            subscribers.push({
                email: email,
                name: name,
                timestamp: new Date().toISOString(),
                source: document.title
            });
            localStorage.setItem('subscribers', JSON.stringify(subscribers));

            // 向服务器发送（可选）
            fetch('/api/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, name, source: document.title })
            }).catch(err => console.log('订阅发送失败，但已本地保存'));

            // 清除表单
            form.reset();
            alert('感谢订阅！我们会定期发送最新内容到您的邮箱。');
        }

        const searchIndexZh = [
            { title: '深度研究：特朗普封杀Anthropic', category: 'AI治理', date: '2026-03-04', url: '深度研究.html', keywords: ['Anthropic', 'AI治理', '伦理红线', '特朗普'] },
            { title: '每日热点评论', category: 'AI治理', date: '2026-03-04', url: '每日热点评论.html', keywords: ['热点', '评论', '政策'] },
            { title: '太空治理', category: '太空治理', date: '2025-01-01', url: '太空治理.html', keywords: ['太空治理', '制度', '火星'] },
            { title: '人工智能治理', category: 'AI治理', date: '2025-01-01', url: '人工智能治理.html', keywords: ['AI', '治理', '安全'] },
            { title: '与环境伦理学的对话', category: '伦理学', date: '2025-01-01', url: '与环境伦理学的对话.html', keywords: ['伦理学', '环境', '对话'] },
            { title: '禁忌红线', category: '伦理学', date: '2025-01-01', url: '禁忌红线.html', keywords: ['红线', 'FRL', '风险'] },
            { title: '研究归档', category: 'AI治理', date: '2025-01-01', url: '研究归档.html', keywords: ['归档', '研究', '历史'] },
            { title: '资源', category: '伦理学', date: '2025-01-01', url: '资源.html', keywords: ['阅读', '资源', '术语'] }
        ];

        let runtimeSearchIndexZh = searchIndexZh;

        async function loadSearchIndexZh() {
            try {
                const res = await fetch('/data/content-index.json', { cache: 'no-cache' });
                if (!res.ok) return;
                const data = await res.json();
                if (!Array.isArray(data)) return;
                const zhItems = data
                    .filter(item => item.lang === 'zh')
                    .map(item => ({
                        title: item.title,
                        category: item.category,
                        date: item.date,
                        url: item.url,
                        keywords: Array.isArray(item.keywords) ? item.keywords : []
                    }));
                if (zhItems.length > 0) runtimeSearchIndexZh = zhItems;
            } catch (_) {
                // 保持本地回退索引
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>\"']/g, m => map[m]);
        }

        function renderSearchResults(results, query, filter) {
            const container = document.getElementById('searchResults');
            if (!container) return;

            if (results.length === 0) {
                container.innerHTML = `<div class="search-empty">未找到匹配内容。可尝试关键词：AI治理、伦理学、太空治理。</div>`;
                container.classList.add('active');
                return;
            }

            const header = `<div class="search-empty">找到 ${results.length} 条结果 ${query ? `（关键词：${escapeHtml(query)}）` : ''} ${filter !== 'all' ? `（分类：${escapeHtml(filter)}）` : ''}</div>`;
            const items = results.slice(0, 8).map(item => `
                <a class="search-result-item" href="${item.url}">
                    <div class="search-result-title">${escapeHtml(item.title)}</div>
                    <div class="search-result-meta">${escapeHtml(item.category)} · ${escapeHtml(item.date)}</div>
                </a>
            `).join('');

            container.innerHTML = header + items;
            container.classList.add('active');
        }

        // 执行搜索（P0搜索MVP）
        function performSearch() {
            const input = document.getElementById('searchInput');
            const query = (input?.value || '').trim().toLowerCase();
            const activeFilter = document.querySelector('.filter-button.active');
            const filter = activeFilter ? activeFilter.getAttribute('data-filter') : 'all';

            const results = runtimeSearchIndexZh.filter(item => {
                const passFilter = filter === 'all' || item.category === filter;
                if (!passFilter) return false;
                if (!query) return true;

                const haystack = `${item.title} ${item.category} ${item.keywords.join(' ')}`.toLowerCase();
                return haystack.includes(query);
            });

            renderSearchResults(results, query, filter);
        }

        // 按分类筛选
        function filterByCategory(button) {
            document.querySelectorAll('.filter-button').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            performSearch();
        }

        // 回车触发搜索
        document.getElementById('searchInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // 支持从URL参数自动搜索（例如 ?q=AI治理）
        (function initSearchFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (!q) return;

            const input = document.getElementById('searchInput');
            if (!input) return;

            input.value = q;
            performSearch();
        })();

        loadSearchIndexZh();
    </script>
